name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build project
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run build
      
      - name: store env_var for use in the next stips
        run: echo "API_KEY=test" >> $GITHUB_ENV  
        
      - name: Run unit tests with coverage
        run: npm run test:cov

      - name: SHOW API_KEY
        run: echo "API_KEY = $API_KEY"  
        
      - name: Upload coverage report
        if: always() # success() cancelled() failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  docker-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' # contains() startsWith()
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: omaralmgosh/chat-app-image:prod