apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-app
  labels:
    app: chat-app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: chat-app
  template:
    metadata:
      labels:
        app:chat-app
    spec:
      containers:
        - name: chat-app
          image: omaralmgosh/chat-app-image
          ports:
            - containerPort:3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: POD_NAME
              valuFrom:
                fieldRef:
                  fieldPath:metadata.name
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
          httpGet:
            path: /readyz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20    



 