
services:
  express-image:
    image: omaralmgosh/docker-course
    container_name:
      'express-container'
    depends_on:
      - mongo
      - redis
    ports:
      [3000:3000]

  # postegresql:
  #   image: postgres:18.4-alpine3.24
  #   container_name: postegresql
  #   restart: always
  #   # set shared memory limit when using docker compose
  #   shm_size: 128mb
  #   volumes:
  #     - postegredb:/var/lib/postgresql/18/docker
  #   environment:
  #     POSTGRES_USER: postegre
  #     POSTGRES_PASSWORD: postegre 
  #   ports: 
  #     - 5432:5432     

  mongo:
    image: mongo
    container_name: 'mongoDB'
    volumes:
      - mongoDB:/data/db   # this is the same mongoDB that created under ,  and the /data/db is the path insid container
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example 

  # mongo-express:
  #   image: mongo-express
  #   container_name: mong-express-container
  #   depends_on:
  #     - mongo
  #   restart: always
  #   ports:
  #     - 8081:8081
  #   environment:
  #     ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
  #     ME_CONFIG_BASICAUTH_ENABLED: true
  #     ME_CONFIG_BASICAUTH_USERNAME: root
  #     ME_CONFIG_BASICAUTH_PASSWORD: example

  redis:
    image: redis
    container_name: 'redis_container'
   
  nginx:
    image: nginx:stable-alpine
    container_name: nginx_cont
    depends_on:
      - express-image
    volumes:
      - ./nginx/nginx.config:/etc/nginx/conf.d/default.conf
    ports:
    - "8080:80"
    environment:
    - NGINX_HOST=foobar.com
    - NGINX_PORT=80


volumes:
  mongoDB:
  postegredb:          # this will create a volumes and save it in a spicific path ( docker will mange it )      
